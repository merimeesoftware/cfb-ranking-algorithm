# Precompute archived rankings as static JSON (hybrid architecture)
# Runs Saturday evenings (US) after typical game day; also manual dispatch.

name: Precompute Rankings

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (blank = current)"
        required: false
      through_week:
        description: "Precompute weeks 1..N (blank = archived weeks of current season)"
        required: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Precompute static rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.through_week }}" ]; then
            python scripts/precompute_rankings.py --year ${{ github.event.inputs.year }} --through-week ${{ github.event.inputs.through_week }}
          else
            python scripts/precompute_rankings.py --current
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-rankings
          path: |
            static_rankings/
            frontend/static/rankings/
          retention-days: 14

# Soften: do not auto-commit from Actions by default (artifact upload only)
      - name: Commit static rankings for Pages (optional)
        if: false
        run: |
          echo "Enable this step when ready to publish static rankings to main"