# Precompute archived rankings as static JSON (hybrid architecture).
# Interim writer; retired when the #117 KV cron lands.
# A GITHUB_TOKEN push does not trigger ci.yml or deploy-cloudflare.yml.
# Publish relies on Workers Builds. Pending Release Ops confirmation.

name: Precompute Rankings

permissions: {}

concurrency:
  group: precompute-rankings
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (blank = current)"
        required: false
        type: number
      through_week:
        description: "Precompute weeks 1..N (blank = archived weeks of current season)"
        required: false
        type: number

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore CFBD snapshots
        uses: actions/cache@v4
        with:
          path: |
            .cache
            static_rankings
          key: cfbd-precompute-${{ github.run_id }}
          restore-keys: |
            cfbd-precompute-

      - name: Precompute static rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Repo variable. "1" skips the run before any live fetch. Empty is off.
          CFBD_KILL: ${{ vars.CFBD_KILL }}
          # Ingest job. Production wrangler stays CFBD_OFFLINE=1 and is not
          # set here, so this cron can fetch while visitors stay offline.
          # The current season's bulk /games call is refreshed every run.
          CFBD_MAX_CALLS: "8"
          YEAR: ${{ github.event.inputs.year }}
          THROUGH_WEEK: ${{ github.event.inputs.through_week }}
        run: |
          if [ -n "$YEAR" ] && [ -n "$THROUGH_WEEK" ]; then
            python scripts/precompute_rankings.py --year "$YEAR" --through-week "$THROUGH_WEEK"
          else
            python scripts/precompute_rankings.py --current
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-rankings
          path: frontend/static/rankings/
          retention-days: 14

  publish:
    needs: precompute
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download precomputed rankings
        uses: actions/download-artifact@v7
        with:
          name: static-rankings
          path: frontend/static/rankings

      # Derived JSON only. A token push does not start ci.yml, so
      # deploy-cloudflare.yml (workflow_run on CI) does not deploy it.
      # Workers Builds is the path that publishes this commit.
      # Pending Release Ops confirmation.
      - name: Publish static rankings
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/publish_static_rankings.sh
          git push origin "HEAD:${GITHUB_REF_NAME}"
