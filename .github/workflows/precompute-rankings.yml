# Precompute archived rankings as static JSON (hybrid architecture).
# Interim writer; retired when the #117 KV cron lands.
# Publish pushes bot/precompute-<year>-w<week> and opens a pull request.
# A GITHUB_TOKEN push does not start ci.yml, so publish dispatches that
# workflow on the bot branch. Workers Builds is the GitHub App check on
# the push. No ruleset bypass.

name: Precompute Rankings

permissions: {}

concurrency:
  group: precompute-rankings
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (blank = current)"
        required: false
        type: number
      through_week:
        description: "Precompute weeks 1..N (blank = archived weeks of current season)"
        required: false
        type: number

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Precompute static rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Repo variable. "1" skips the run before any live fetch. Empty is off.
          CFBD_KILL: ${{ vars.CFBD_KILL }}
          # Ingest job. Production wrangler stays CFBD_OFFLINE=1 and is not
          # set here, so this cron can fetch while visitors stay offline.
          # Actions does not cache CFBD responses. A cold run is /teams,
          # two prior seasons (skipped when published priors exist), and
          # one bulk /games call. The clamp stays 8.
          # A saved week whose algo stamp is not ALGO_VERSION is rebuilt,
          # not only a missing week. Week solves are local after that one
          # bulk payload. From this tree:
          #   year=2024 through_week=15 → 4 calls
          #   year=2026 through_week=10 → 2 calls
          # 2025 is refused. Priors stay the v5.3 blend seed.
          CFBD_MAX_CALLS: "8"
          YEAR: ${{ github.event.inputs.year }}
          THROUGH_WEEK: ${{ github.event.inputs.through_week }}
        run: |
          if [ -n "$YEAR" ] && [ -n "$THROUGH_WEEK" ]; then
            python scripts/precompute_rankings.py --year "$YEAR" --through-week "$THROUGH_WEEK"
          else
            python scripts/precompute_rankings.py --current
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-rankings
          path: frontend/static/rankings/
          retention-days: 14

  publish:
    needs: precompute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push the bot branch, open the PR, and dispatch ci.yml.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Download precomputed rankings
        uses: actions/download-artifact@v8
        with:
          name: static-rankings
          path: frontend/static/rankings

      # Derived JSON only. Never push to the default branch: the ruleset
      # rejects it. A token push does not start ci.yml, so the script
      # dispatches that workflow. Workers Builds is the GitHub App on the
      # push. deploy-cloudflare.yml still waits for a push of CI on main.
      - name: Publish static rankings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA="$(git rev-parse HEAD)"
          export BASE_SHA
          sh scripts/publish_static_rankings.sh
          python3 scripts/open_rankings_pr.py
