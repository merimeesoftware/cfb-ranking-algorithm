# Precompute archived rankings as static JSON (hybrid architecture)
# Runs Saturday evenings (US) after typical game day; also manual dispatch.

name: Precompute Rankings

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Season year (blank = current)"
        required: false
      through_week:
        description: "Precompute weeks 1..N (blank = archived weeks of current season)"
        required: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore CFBD snapshots
        uses: actions/cache@v4
        with:
          path: |
            .cache
            static_rankings
          key: cfbd-precompute-${{ github.run_id }}
          restore-keys: |
            cfbd-precompute-

      - name: Precompute static rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Repo variable. "1" skips the run before any live fetch. Empty is off.
          CFBD_KILL: ${{ vars.CFBD_KILL }}
          # Ingest job. Production wrangler stays CFBD_OFFLINE=1 and is not
          # set here, so this cron can fetch while visitors stay offline.
          # Steady Sunday: 1 bulk /games call. Cold Sunday adds /teams and
          # two baseline seasons (4). Cap 8. 8×5 in-season Sundays = 40,
          # under the 50/month cron cap. See config/cfbd-month.json.
          CFBD_MAX_CALLS: "8"
        run: |
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.through_week }}" ]; then
            python scripts/precompute_rankings.py --year ${{ github.event.inputs.year }} --through-week ${{ github.event.inputs.through_week }}
          else
            python scripts/precompute_rankings.py --current
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-rankings
          path: |
            static_rankings/
            frontend/static/rankings/
          retention-days: 14

      - name: Publish static rankings
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/static/rankings static_rankings
          if git rev-parse -q --verify HEAD >/dev/null; then
            git reset -q HEAD -- static_rankings/_sources || true
          fi
          if git diff --cached --quiet; then
            echo "No ranking changes to publish"
            exit 0
          fi
          git commit -m "Publish precomputed rankings"
          git push origin "HEAD:${GITHUB_REF_NAME}"