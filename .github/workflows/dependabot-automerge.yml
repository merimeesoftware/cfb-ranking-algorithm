name: Dependabot auto-merge

# Merges non-major Dependabot PRs only after every other check on the PR
# head commit has completed and passed. There are no required status checks
# on main, so `gh pr merge --auto` merged immediately (#85 landed 12 seconds
# after it opened, before CI finished). This job waits instead.
#
# Passing = every check run (except this job) concluded success or skipped,
# CI's Python and Frontend checks are present, and any commit statuses are
# success. Anything else exits non-zero and leaves the PR open.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks, then merge non-major update
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_CHECK: automerge
          REQUIRED_CHECKS: "Python Frontend"
          INTERVAL: "20"
          MAX_WAIT: "1800"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MAX_WAIT ))
          # Give other workflows and apps time to register their checks.
          sleep "$INTERVAL"
          while :; do
            runs=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100" \
              --jq "[.check_runs[] | select(.name != \"$SELF_CHECK\")]")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            missing=""
            for name in $REQUIRED_CHECKS; do
              jq -e --arg n "$name" 'any(.[]; .name == $n)' <<<"$runs" >/dev/null || missing="$missing $name"
            done
            status_state=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status" \
              --jq 'if .total_count == 0 then "none" else .state end')

            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped")) | "\(.name)=\(.conclusion)"] | join(", ")' <<<"$runs")
            if [ -n "$failed" ]; then
              echo "::error::Not merging: checks did not pass: $failed"
              exit 1
            fi
            if [ "$status_state" = "failure" ] || [ "$status_state" = "error" ]; then
              echo "::error::Not merging: commit status is $status_state"
              exit 1
            fi

            if [ "$pending" -eq 0 ] && [ -z "$missing" ] && [ "$status_state" != "pending" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Not merging: timed out (pending=$pending, missing:${missing:- none}, status=$status_state)"
              exit 1
            fi
            echo "Waiting: pending=$pending, missing:${missing:- none}, status=$status_state"
            sleep "$INTERVAL"
          done

          echo "All checks passed on $HEAD_SHA:"
          jq -r '.[] | "  \(.name)=\(.conclusion)"' <<<"$runs"
          # --match-head-commit refuses to merge if a newer commit was pushed.
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Note held major bump
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held for manual review: major version bump. Merge by hand after review."
