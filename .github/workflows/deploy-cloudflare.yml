name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  validate-pages-build:
    name: Validate Pages build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Pages output)
        working-directory: frontend
        run: npm ci && npm run check && npm run build

      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: frontend/build
          retention-days: 7

  deploy-api:
    name: Deploy API (Containers)
    needs: validate-pages-build
    if: vars.ENABLE_CLOUDFLARE_CONTAINERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy production API
        working-directory: worker
        run: npx wrangler deploy --config ../wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy dev API
        if: vars.DEPLOY_CLOUDFLARE_DEV == 'true'
        working-directory: worker
        run: npx wrangler deploy --config ../wrangler.toml --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke test
    needs: [validate-pages-build, deploy-api]
    if: >
      always() &&
      needs.validate-pages-build.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: API health check
        if: vars.API_URL != ''
        run: |
          curl -sf --max-time 30 "${{ vars.API_URL }}/"
          curl -sf --max-time 120 "${{ vars.API_URL }}/rankings?year=2024&week=10" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d.get('team_rankings',[]))>0"

      - name: Skip API smoke (API_URL not set)
        if: vars.API_URL == ''
        run: echo "Set repository variable API_URL to enable post-deploy smoke tests."
