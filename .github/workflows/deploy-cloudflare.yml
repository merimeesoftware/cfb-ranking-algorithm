# Cloudflare deployment uses native Git integration — NOT wrangler-action in CI.
# See docs/DEPLOY-CLOUDFLARE.md for setup (connect repo in Cloudflare Pages dashboard).
#
# This workflow only validates that the frontend build succeeds after CI passes.
# Cloudflare Pages auto-deploys on push to main when Git integration is connected.

name: Validate Cloudflare Pages Build

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  validate-pages-build:
    name: Validate frontend build for Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (same-origin /api — no VITE_API_URL required)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Deployment note
        run: |
          echo "Build validated. Cloudflare Pages deploys via Git integration — not GitHub Actions."
          echo "Setup: https://dash.cloudflare.com → Workers & Pages → Connect to Git"
          echo "See docs/DEPLOY-CLOUDFLARE.md"
