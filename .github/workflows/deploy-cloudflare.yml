name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build frontend
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: npm ci && npm run check && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-assets
          path: frontend/build
          retention-days: 7

  deploy:
    name: Deploy Worker (frontend + API)
    needs: build
    if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: worker-assets
          path: frontend/build

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix worker

      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy dev Worker
        if: vars.DEPLOY_CLOUDFLARE_DEV == 'true'
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke test
    needs: [build, deploy]
    if: >
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        if: vars.WORKER_URL != ''
        run: |
          curl -sf --max-time 30 "${{ vars.WORKER_URL }}/"
          curl -sf --max-time 120 "${{ vars.WORKER_URL}/api/rankings?year=2024&week=10" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d.get('team_rankings',[]))>0"

      - name: Skip smoke (WORKER_URL not set)
        if: vars.WORKER_URL == ''
        run: echo "Set repository variable WORKER_URL to enable post-deploy smoke tests."
