name: Label permission probe

# Temporary. Deletes the label this probe created, then this file is removed.

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Delete probe label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${GH_REPO}/labels/probe-label-perm-deny"
          echo DELETE_DONE
