name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install and lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 pytest
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=frontend,node_modules,venv,.venv

      - name: Test
        run: pytest -v --ignore=frontend
        env:
          CFBD_API_KEY: test-key-for-unit-tests

      - name: CFBD monthly budget
        run: python scripts/check_cfbd_month.py

      - name: AI provider caps and retired name
        run: python scripts/check_ai_providers.py

  worker:
    name: Worker caps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install and test paid-call caps
        working-directory: worker
        run: |
          npm ci
          node --experimental-strip-types --test test/caps.test.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, check, and build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
