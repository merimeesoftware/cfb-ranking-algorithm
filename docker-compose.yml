# Local Docker Compose — API (:5001) + Vite frontend (:5173)
#
# Prerequisites: Docker Desktop, `.env` with CFBD_API_KEY (and MINIMAX_API_KEY for live AI).
#
#   docker compose up --build
#   open http://localhost:5173
#
# Live smoke defaults (override in `.env`):
#   CFBD_OFFLINE=0  AI_MODE=live  CFBD_MAX_CALLS=25  AI_MAX_CALLS=25
#
# Stop:
#   docker compose down

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfb-api
    ports:
      - "5001:8080"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      PORT: "8080"
      CACHE_DIR: /app/.cache
      STATIC_RANKINGS_DIR: /app/frontend_static_rankings
      CFBD_OFFLINE: ${CFBD_OFFLINE:-0}
      AI_MODE: ${AI_MODE:-live}
      CFBD_MAX_CALLS: ${CFBD_MAX_CALLS:-25}
      AI_MAX_CALLS: ${AI_MAX_CALLS:-25}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-50}
    volumes:
      - ./.cache:/app/.cache
      - ./frontend/static/rankings:/app/frontend_static_rankings
    command:
      [
        "gunicorn",
        "app:app",
        "--bind",
        "0.0.0.0:8080",
        "--workers",
        "1",
        "--threads",
        "2",
        "--timeout",
        "300",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/agent/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: node:22-bookworm-slim
    container_name: cfb-web
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend:/app
      - cfb_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cfb_web_node_modules:
