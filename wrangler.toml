name = "true-rankings-cfb"
main = "worker/src/index.ts"
compatibility_date = "2026-03-01"

# Unified Workers deploy: SvelteKit static frontend + Flask API container.
#   npm run build --prefix frontend && npx wrangler deploy
#
# Secrets (set once per environment):
#   wrangler secret put CFBD_API_KEY
#   wrangler secret put MINIMAX_API_KEY      # optional
#   wrangler secret put CACHE_CLEAR_SECRET   # optional
# See docs/DEPLOY-CLOUDFLARE.md

[assets]
directory = "./frontend/build"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Production spend mode. AI_MODE and CFBD_OFFLINE stay live / 0.
# Kill switches AI_KILL and CFBD_KILL default off. Preview hostnames force
# stub/offline unless PREVIEW_AI_MODE / PREVIEW_CFBD_OFFLINE are set.
#
# Monthly CFBD projection (free tier is about 1,000; ceiling is 900).
# The formula lives in config/cfbd-month.json:
#   cron 24 calls/Sunday × 52/12 = 104
#   live CFBD_MAX_CALLS 4/day × 31 = 124
#   104 + 124 = 228
# AI_MAX_CALLS is 0 until Michael sets a dollar figure: stub or cached
# answers only, no live MiniMax. Unset still falls back to the in-code
# 100 / 25 defaults. These two lines are the production values.
[vars]
AI_MODE = "live"
CFBD_OFFLINE = "0"
AI_MAX_CALLS = "0"
CFBD_MAX_CALLS = "4"

# Per-visitor limits keyed on CF-Connecting-IP. namespace_id is account-unique.
# Counters are per Cloudflare location; the Durable Object daily budget is global.
# period must be 10 or 60 seconds.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "9301"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "9302"
simple = { limit = 10, period = 60 }

[[containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

# Daily AI/CFBD counters live on the existing CfbApiContainer class
# (instance name spend-budget). Do not add a migration for them: non-production
# Workers Builds upload a version, and a new migration tag fails that upload.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]

# --- Dev environment ---
# URL: https://cfb-rankings-dev.<account>.workers.dev
[env.dev]
name = "cfb-rankings-dev"

[env.dev.assets]
directory = "./frontend/build"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Non-production worker. Preview/dev stays stub + offline.
# PREVIEW_AI_MODE / PREVIEW_CFBD_OFFLINE are the explicit overrides.
[env.dev.vars]
AI_MODE = "stub"
CFBD_OFFLINE = "1"
AI_MAX_CALLS = "0"
CFBD_MAX_CALLS = "4"

[[env.dev.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "9311"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "9312"
simple = { limit = 10, period = 60 }

[[env.dev.containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 2

[[env.dev.durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]
