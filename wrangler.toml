name = "true-rankings-cfb"
main = "worker/src/index.ts"
compatibility_date = "2026-03-01"

# Unified Workers deploy: SvelteKit static frontend + Flask API container.
#   npm run build --prefix frontend && npx wrangler deploy
#
# Secrets (set once per environment):
#   wrangler secret put CFBD_API_KEY
#   wrangler secret put MINIMAX_API_KEY      # optional
#   wrangler secret put CACHE_CLEAR_SECRET   # optional
# See docs/DEPLOY-CLOUDFLARE.md

[assets]
directory = "./frontend/build"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
AI_MODE = "live"
CFBD_OFFLINE = "0"

[[containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]

# --- Dev environment ---
# URL: https://cfb-rankings-dev.<account>.workers.dev
[env.dev]
name = "cfb-rankings-dev"

[env.dev.assets]
directory = "./frontend/build"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[env.dev.vars]
AI_MODE = "stub"
CFBD_OFFLINE = "0"

[[env.dev.containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 2

[[env.dev.durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]
