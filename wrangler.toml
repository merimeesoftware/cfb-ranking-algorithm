name = "cfb-rankings-api"
main = "worker/src/index.ts"
compatibility_date = "2026-03-01"

# Cloudflare Containers API — Flask in Docker, routed by this Worker.
# Secrets (set once per environment):
#   wrangler secret put CFBD_API_KEY
#   wrangler secret put MINIMAX_API_KEY      # optional
#   wrangler secret put CACHE_CLEAR_SECRET   # optional
# See docs/DEPLOY-CLOUDFLARE.md

[vars]
AI_MODE = "off"
CFBD_OFFLINE = "0"

[[containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]

# --- Dev environment (preview / staging API) ---
# URL: https://cfb-rankings-api-dev.<account>.workers.dev
[env.dev]
name = "cfb-rankings-api-dev"

[env.dev.vars]
AI_MODE = "stub"
CFBD_OFFLINE = "0"

[[env.dev.containers]]
class_name = "CfbApiContainer"
image = "./Dockerfile"
max_instances = 2

[[env.dev.durable_objects.bindings]]
name = "CFB_API"
class_name = "CfbApiContainer"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["CfbApiContainer"]
