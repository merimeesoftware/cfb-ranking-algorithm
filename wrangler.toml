name = "cfb-rankings-api"
main = "app.py"
compatibility_date = "2024-08-01"

# Cloudflare Containers deployment
# Enable with: wrangler deploy (requires Containers beta access)
# Set secrets: wrangler secret put CFBD_API_KEY

[vars]
FLASK_ENV = "production"
CACHE_BACKEND = "r2"

# Uncomment when R2 bucket is provisioned:
# [[r2_buckets]]
# binding = "CACHE_BUCKET"
# bucket_name = "cfb-rankings-cache"
