name = "cfb-rankings-api"
main = "app.py"
compatibility_date = "2024-08-01"

# Cloudflare Containers / Workers API service.
# Production secrets live HERE (Cloudflare), not in GitHub or Cursor:
#   wrangler secret put CFBD_API_KEY
#   wrangler secret put MINIMAX_API_KEY    # optional
# Or: Dashboard → this service → Settings → Variables and Secrets
# See docs/SECRETS.md

[vars]
FLASK_ENV = "production"
CACHE_BACKEND = "r2"

# Uncomment when R2 bucket is provisioned:
# [[r2_buckets]]
# binding = "CACHE_BUCKET"
# bucket_name = "cfb-rankings-cache"
