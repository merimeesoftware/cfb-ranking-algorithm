# Render Blueprint — DEPRECATED
# This project has migrated to Cloudflare Pages (frontend) + Cloudflare Containers (API).
# See docs/superpowers/specs/2026-08-01-ops-cloudflare-runbook.md for deployment instructions.
# Keep this file temporarily as fallback during cutover.

services:
  - type: web
    name: cfb-rankings-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CFBD_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: false

  - type: web
    name: cfb-rankings-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: cfb-rankings-api
          property: host
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: false
